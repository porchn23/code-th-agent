[package]
name = "thai-agentic"
version = "0.1.0"
description = "Compounding AI agent — Rust desktop app (port of thai-agentic Node.js engine)"
authors = ["porchn chin"]
edition = "2021"
rust-version = "1.77"

# lib แยกจาก bin เพื่อให้เขียน unit test ได้ (cargo test ใช้ lib crate)
[lib]
name = "thai_agentic_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "time", "sync", "signal"] }
tokio-stream = "0.1"
futures-util = "0.3"

# rustls เพื่อไม่ต้องพึ่ง OpenSSL บน Windows
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset", "gzip"] }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# auth — ต้องเข้าคอมแพติเบิลกับ Node.js scryptSync (N=16384, r=8, p=1, keylen=64)
scrypt = { version = "0.11", default-features = false }
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
hex = "0.4"
base64 = "0.22"

regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
similar = "2"
url = "2"
percent-encoding = "2"
once_cell = "1"
parking_lot = "0.12"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
